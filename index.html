<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Analyseur de polarisation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Intensité en sortie de l’analyseur</h1>

        <section class="simulation">

            <!-- ================================================= -->
            <!-- CADRAN VECTORIEL                                  -->
            <!-- ================================================= -->

            <div class="card">

                <canvas id="vectorCanvas"></canvas>

                <div class="legend">

                    <div class="legend-item">
                        <span class="legend-line red"></span>
                        Champ incident
                    </div>

                    <div class="legend-item">
                        <span class="legend-line purple"></span>
                        Axe de l'analyseur
                    </div>

                    <div class="legend-item">
                        <span class="legend-line green"></span>
                        Projection
                    </div>

                </div>

            </div>


            <!-- ================================================= -->
            <!-- GRAPHE I(theta)                                   -->
            <!-- ================================================= -->

            <div class="card">

                <canvas id="graphCanvas"></canvas>

            </div>

        </section>


        <!-- ===================================================== -->
        <!-- CURSEUR THETA                                        -->
        <!-- ===================================================== -->

        <section class="slider-container">

            <label for="thetaSlider">
                Angle de l'analyseur θ
            </label>

            <input
                type="range"
                id="thetaSlider"
                min="0"
                max="360"
                step="1"
                value="0"
            >

            <div class="theta-value">
                θ = <span id="thetaValue">0</span>°
            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
